<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="store-scene" aria-hidden="true">
    <div class="awning"></div>
    <div class="shelf shelf-top">
      <span class="bag bag-blue"></span>
      <span class="bag bag-green"></span>
      <span class="tank">
        <span class="fish fish-one">🐠</span>
        <span class="fish fish-two">🐟</span>
        <span class="bubble bubble-one"></span>
        <span class="bubble bubble-two"></span>
      </span>
      <span class="bag bag-gold"></span>
    </div>
    <div class="shelf shelf-bottom">
      <span class="cage">
        <span class="wheel"></span>
      </span>
      <span class="toy">🦴</span>
      <span class="toy">🧶</span>
      <span class="plant"></span>
    </div>
  </div>

  <main class="game">
    <section class="intro" aria-labelledby="game-title">
      <p class="eyebrow">Pet Store</p>
      <h1 id="game-title">Memory Match</h1>
    </section>

    <p id="status"></p>
    <div id="table"></div>
  </main>

  <!-- Order matters: the contract first, then deck, rules, and screen. -->
  <script src="state.js"></script>
  <script src="deck.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
